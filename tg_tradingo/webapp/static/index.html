<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TG TradinGo — Monitor</title>
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<header>
  <h1>TG TradinGo</h1>
  <div class="meta">
    <span class="overall-dot dot off" id="overall"></span>
    <span id="updated">—</span>
  </div>
</header>

<main>
  <h2>Infrastruttura</h2>
  <div class="grid" id="lights"></div>

  <h2>Conti</h2>
  <div class="grid accounts" id="accounts"></div>

  <h2>Canali</h2>
  <div class="grid" id="channels"></div>

  <h2>Posizioni aperte</h2>
  <div class="card" style="overflow-x:auto">
    <table class="events"><tbody id="opens"></tbody></table>
  </div>

  <h2>Ultimi eventi bridge</h2>
  <div class="card" style="overflow-x:auto">
    <table class="events"><tbody id="events"></tbody></table>
  </div>
</main>

<footer>TG TradinGo Monitor — Fase 2 (PnL + sola lettura)</footer>

<!-- Modal dettaglio canale -->
<div id="ch-modal" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-head">
      <span id="ch-modal-title">Canale</span>
      <div class="modal-period">
        <button onclick="loadChannel(null,7)">7g</button>
        <button onclick="loadChannel(null,30)" class="active">30g</button>
        <button onclick="loadChannel(null,90)">90g</button>
        <button onclick="loadChannel(null,180)">180g</button>
      </div>
      <button class="modal-close" onclick="document.getElementById('ch-modal').style.display='none'">✕</button>
    </div>
    <div id="ch-modal-summary" class="modal-summary"></div>
    <div style="overflow-x:auto">
      <table class="events" id="ch-modal-table"><thead><tr><th>Chiusura</th><th>Simbolo</th><th>Dir</th><th>Lotti</th><th>Pips</th><th>A 0.01</th><th>Reale</th><th>Motivo</th><th>Conto</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script src="/static/app.js?v=4"></script>
</body>
</html>
